version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    target-branch: master
    commit-message:
      prefix: chore
