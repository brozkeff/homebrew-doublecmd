name: Tests
on:
  pull_request:
  push:
    branches: [master]
    paths: [scripts/**, test/**, Casks/**, Gemfile, Gemfile.lock, .rubocop.yml, .github/workflows/tests.yml]
  workflow_dispatch:
    inputs:
      historical_download:
        description: Download and verify both 1.2.8 DMGs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec ruby -Itest test/releases_test.rb
      - run: bundle exec rubocop
      - run: ruby -c Casks/double-commander.rb
      - name: Verify historical downloads
        if: inputs.historical_download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ruby scripts/releases.rb render --tag v1.2.8 --output tmp/v1.2.8
          ruby scripts/verify_historical.rb
